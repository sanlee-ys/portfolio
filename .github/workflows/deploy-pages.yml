name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone: `sitemap.xml` derives each
      # page's <lastmod> from its source file's last commit, and `git log -1` in
      # a depth-1 checkout returns the checkout commit for every file. The
      # integration detects shallowness and drops lastmod rather than dating
      # every page identically, so without this the sitemap still builds — it
      # just loses its dates.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v6

      # Since ADR-006 the site is built rather than served from the repo tree.
      # Only `dist/` is uploaded now, so `decisions/`, `learning/`, `handoff/`
      # and the READMEs stop being published — checked before the migration, and
      # nothing on the site links to them (verified 2026-09-04: no page links
      # `learning/`, and the Work page's learning link goes to the external
      # learning-notes site).
      - name: Install and build
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: "dist"

      - id: deployment
        uses: actions/deploy-pages@v5
