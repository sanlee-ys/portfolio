name: QA

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Since ADR-006 the site is built, so every gate below reads `dist/`
      # rather than the repo tree. SITE_ROOT is what points them there, and each
      # walking gate fails if it finds no pages — a gate aimed at an empty
      # directory would otherwise pass while checking nothing, which is the
      # silent failure ADR-006 named as the main risk of this move.
      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Private-repo guard (adversarial suites, A+B and C)
        run: node --test scripts/private-repo-check.test.cjs scripts/private-name-precommit.test.cjs

      # The review workflow's classify step, run against synthetic execution
      # logs with `gh` stubbed. ADR-005 has been amended four times and each
      # amendment closes with "this change cannot test itself" — editing
      # claude-review.yml makes the Claude App self-skip the review on that PR.
      # That is still true of the review; it is no longer true of the step that
      # classifies it. Needs bash and jq, both on this runner.
      - name: Review classify step (synthetic execution logs)
        run: node --test scripts/classify-review-outcome.test.cjs

      # The font-coverage gate's own adversarial suite. It breaks a real fixture
      # six ways — stray glyph, glyph hidden in a rendered attribute, a range
      # widened without re-cutting, a tampered woff2, an unknown entity, an
      # empty walk — and demands a non-zero exit for each. A gate whose passing
      # run is its only evidence is how this repo shipped three checks that
      # never checked anything.
      - name: Font-coverage gate (adversarial suite)
        run: node --test scripts/font-coverage.test.cjs

      # resume-pdf's embedded-font assertion, and its own adversarial suite. The
      # check it replaced could not fail: the script closed by printing "Fonts
      # embedded: Geist" off `document.fonts`, which proves a woff2 loaded into
      # the browser and says nothing about the written PDF. Chromium emits these
      # as Type 3 fonts (glyphs as /CharProcs drawing procedures, no /FontFile),
      # because Skia cannot embed a VARIABLE font program — so the obvious test,
      # "does it have a /FontFile", concludes wrongly that nothing is embedded.
      # Both shapes pass here; anything that is neither fails.
      - name: resume.pdf embeds its glyphs (adversarial suite)
        run: node --test scripts/resume-pdf.test.cjs

      # The parity counter that backs up the published-metrics gate. It exempted
      # Markdown entirely until 2026-07-28, so a Markdown marker the value
      # pattern could not read raised no complaint and looked exactly like a file
      # making no claims. The fix is unfalsifiable without this suite: a parity
      # counter that returns 0 and one that is correct are identical on a clean
      # tree, so each hole is exercised by a marker the pattern genuinely cannot
      # parse.
      - name: published-metrics marker parity (adversarial suite)
        run: node --test scripts/check-published-metrics.test.cjs

      # An internal href can be valid while a real page remains stranded, and
      # a clean site cannot prove the checker would catch that. Exercise the
      # graph walk, back-link contract, narrow exemptions, and fail-closed walk
      # against synthetic sites before checking the build.
      - name: Navigation contract (adversarial suite)
        run: node --test scripts/navigation-check.test.cjs

      # The telltale evidence gate's own adversarial suite. It drives all five
      # failure modes against fixtures it builds itself: an unknown key, a
      # rendered value that differs from the record, a page with zero markers
      # (an inert gate reads exactly like a clean one), a malformed record, and
      # a frame line that is not ASCII. It also pins the case a page-wide
      # substring search cannot see — a wrong number typed beside a correct one.
      - name: Telltale evidence gate (adversarial suite)
        run: node --test scripts/check-telltale-evidence.test.cjs

      # The figure contract's own adversarial suite. The gate has three ways to
      # be worthless and every one looks like a clean run: it can fail nothing,
      # it can fail the wrong thing, or it can hold an exemption for a figure
      # that is gone. The second one is the reason the suite exists — one plate
      # on this site reads `wipe &#8594; cfg`, which is digits in the source and
      # an arrow on the screen, so a gate that skipped the entity decode would
      # fail a correct figure and push a lane toward deleting it.
      - name: Figure contract (adversarial suite)
        run: node --test scripts/figure-contract.test.cjs

      # Ports the architecture repo's 'Downstream surfaces' rule down to this repo's
      # ADR tier. Stdlib Python, no venv — this is a static site with no Python
      # toolchain, and a doc linter is not a reason to grow one. Every ADR complies,
      # so it is enforced with zero exceptions (LEGACY_NO_DOWNSTREAM is empty). No
      # count here on purpose — the linter prints the live one, and prose goes stale.
      # `python3`, not `python`: this job sets up Node, not Python, and only python3
      # is guaranteed on the ubuntu runner image.
      - name: ADRs list their downstream surfaces
        run: python3 scripts/lint_decisions.py

      - name: Check internal links
        run: node scripts/link-check.cjs
        env:
          SITE_ROOT: dist

      # Link-check proves that href targets exist. This proves the other half:
      # every published page is discoverable from the front page and every
      # detail page gives the reader a working, visible way back.
      - name: Page reachability and back navigation
        run: node scripts/navigation-check.cjs
        env:
          SITE_ROOT: dist

      # Every character in the built copy must have a glyph in a font this site
      # ships. A codepoint the fonts lack still RENDERS — borrowed from a
      # platform face — so it survives every other gate, looks right on the
      # machine that wrote it, and changes shape on someone else's. U+2192
      # shipped that way for months (PR #169). Needs no font toolchain: it reads
      # scripts/font-coverage.json, which subset-fonts.py writes, and re-hashes
      # each woff2 so a stale manifest fails rather than being believed.
      - name: Every character in the copy has a self-hosted glyph
        run: node scripts/font-coverage.cjs
        env:
          SITE_ROOT: dist

      # Published figures are quoted from the classifier's eval runs. They used to
      # be retyped by hand, and in July 2026 that put two-prompt-changes-stale
      # numbers on this site and on the résumé. This asserts every marked figure
      # against the producer's generated artifact. A mismatch fails; a fetch
      # failure warns and passes, so an outage cannot redden the build.
      # SITE_ROOT covers the HTML only. This gate also reads Markdown markers in
      # the ADRs, README and learning notes, which are never built, so it walks
      # the repo tree for those and `dist/` for pages. Pointing it at one root
      # would silently halve its reach.
      - name: Published metrics match the classifier artifact
        run: node scripts/check-published-metrics.cjs
        env:
          SITE_ROOT: dist

      # The telltale page argues that a gauge may not render a number nobody
      # measured. A page that argues that and then carries hand-typed counts
      # refutes itself, so every figure and every pasted terminal frame on it is
      # marked and compared against src/data/telltale-evidence.json, which
      # scripts/pull-telltale-evidence.cjs re-reads from that repository at a
      # pinned commit. The comparison is attribute-anchored equality, not a
      # substring search: a wrong number typed beside a correct one is invisible
      # to a page-wide search, and this site has a page about exactly that.
      - name: Telltale figures and frames match the generated record
        run: node scripts/check-telltale-evidence.cjs
        env:
          SITE_ROOT: dist

      # A hand-drawn plate is markup somebody typed, so a count inside one is a
      # published figure with no producer and no gate. This fails the build on a
      # digit inside an <svg> <text> node, unless the figure sits in the
      # measured baseline or the <svg> declares data-fig-generated="true". It
      # also requires the two caption slots on every new figure, which is what
      # stops a figure sequence from ending on a win with the caveat elsewhere.
      # It reads dist/ and decodes entities, because the rule is about what a
      # reader sees. See decisions/ADR-013.
      - name: Figure contract (no digit in a hand-drawn plate; every figure captioned)
        run: node scripts/figure-contract.cjs
        env:
          SITE_ROOT: dist

      - name: Private-repo guard (never name/link/describe a private repo)
        run: node scripts/private-repo-check.cjs
        env:
          # Authenticated read raises the API rate limit; the token can't see
          # other repos' private visibility, and the script filters !private.
          GITHUB_TOKEN: ${{ github.token }}
          SITE_ROOT: dist

      - name: Install Playwright Chromium
        working-directory: scripts
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Measures the RENDERED colour of every text element, in both themes,
      # against WCAG AA. A declared colour can be compliant while the painted
      # pixel is not — an `opacity` on top of a 5.81:1 token composited it to
      # 3.80:1 on this site, and nothing that reads declared values could see
      # it. See ADR-009.
      - name: Text contrast AA (rendered, both themes)
        run: node scripts/contrast-check.cjs
        env:
          SITE_ROOT: dist

      # Serves `dist/` over HTTP rather than opening files. The layout emits
      # root-absolute asset paths, which do not resolve over `file://` — and an
      # unstyled page does not overflow, so the file:// version of this gate
      # would pass while measuring nothing.
      - name: Mobile QA gate (no horizontal overflow at 320/360/390/430)
        run: node scripts/mobile-qa.cjs
        env:
          SITE_ROOT: dist

      # Anything claiming to be a control must be clickable across its box.
      # SVG hit-testing defaults to `visiblePainted`, so `fill: none` leaves a
      # shape untouchable in its middle while every other signal — role,
      # tabindex, aria-label, handlers, the stylesheet read line by line —
      # stays correct. The diagram's nodes shipped that way: 171x57 boxes with
      # a real hit target of 1.8%, reported as "couldn't click ... seems to be
      # a bit of a delay" because `:hover` paints a fill and a painted fill IS
      # hittable. Only visible as rendered geometry, hence a browser gate.
      - name: Hit targets (a control is clickable across its box)
        run: node scripts/hit-target.cjs
        env:
          SITE_ROOT: dist

      # The gate's own adversarial suite: it builds a node with the original
      # defect and demands a non-zero exit, then the two legitimate fixes and
      # demands a pass. It also pins the false positives that the gate's first
      # draft produced by keying on the inherited `cursor: pointer`. Runs here,
      # after the Playwright step, because it spawns the gate.
      - name: Hit-target gate (adversarial suite)
        run: node --test scripts/hit-target.test.cjs

      # No SVG text may render under 9px at 320px (CLAUDE.md, "The microtext
      # floor"; ADR-014 section 5). This was a rule with no gate until
      # 2026-09-01, on the recorded ground that no gate could check it — a fact
      # about contrast-check, which skips SVG text, and not about gates.
      #
      # It measures the plate scale with getScreenCTM() rather than a viewBox
      # ratio, so a transform above the text node and a letterboxing
      # preserveAspectRatio both count. It renders rather than reading source,
      # which is the half that matters most: diagram.js rewrites the system
      # map's viewBox at phone widths, so the attribute in the markup is not the
      # one the browser uses. A source-reading measurement of that plate
      # reported 4.08px where the reader gets 12.98px, and proposed repairs to a
      # correct figure.
      - name: Microtext floor (no SVG text under 9px at 320px)
        run: node scripts/microtext-floor.cjs
        env:
          SITE_ROOT: dist

      # The gate's own adversarial suite. It drives each way the gate must fail
      # — a short label, a legible declared size under a sub-1 scale, a
      # runtime-shrunk plate, a transform, a letterboxed plate, a build with no
      # SVG text, an empty walk — and each way it must not, including an empty
      # text node and a plate sitting exactly on the floor. It also records a
      # mutation result: swapping the CTM for an in-page width ratio reddens the
      # two blind-spot tests and leaves the runtime-rewrite tests green, so the
      # suite states which choice each test actually proves.
      - name: Microtext floor gate (adversarial suite)
        run: node --test scripts/microtext-floor.test.cjs
