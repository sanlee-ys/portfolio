name: Claude Review

# AI code review built on anthropics/claude-code-action@v1.
#
# INERT without two pieces of human setup:
#   1. The Claude GitHub App installed on this repo.
#   2. The ANTHROPIC_API_KEY repository secret.
# Until both exist the review job fails auth. Nothing in this file contains or
# exposes a key.

# ON DEMAND ONLY, as of 2026-07-26 (ADR-005 Amendment 7). There is no automatic
# trigger: the review fires when San comments `@claude` on a PR, and at no other
# time. It costs nothing when idle.
#
# The progression is worth keeping because each step was taken on evidence.
# `synchronize` was rejected on a logged cost incident (an uncapped fan-out, one
# run per push). `pull_request: [opened]` replaced it as the compromise — one
# automatic pass per PR — and that is what has now been dropped. It was not the
# wrong design: it only started costing real money once Amendments 1–6 made the
# review actually work, so the bill was the evidence that the fix had landed.
on:
  # The only triggers. Both are comment events, which is what makes `@claude`
  # fire at all — the action's trigger phrase only matches once an event
  # delivers the comment.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Least privilege. The review reads code and writes PR/issue comments; it does
# not push commits, so `contents` stays read-only.
#
# `id-token: write` IS required here, even on the direct Claude API key path.
# An earlier version of this comment claimed otherwise and the job failed on
# every PR with "Could not fetch an OIDC token". The mistake was conflating two
# independent auth axes:
#   - GitHub side: the action trades a GitHub OIDC token for a Claude GitHub
#     App installation token, so it can post comments as the app. This needs
#     `id-token: write` whenever the GitHub App is used — always, here.
#   - Anthropic side: API key vs. Bedrock/Vertex/WIF. Separate concern.
# Docs (action FAQ): "If you're using the default GitHub App authentication,
# you must add the `id-token: write` permission to your workflow ... The OIDC
# token is required in order for the Claude GitHub app to function."
# The only way to avoid it is passing a `github_token` input instead of using
# the app, which would post comments as github-actions[bot] rather than Claude.
#
# `actions: read` lets the review read this PR's other check results (e.g.
# whether `qa` passed) instead of reviewing blind to CI. Read-only: it cannot
# trigger, cancel, or rerun workflows. Carried by the action's own example.
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

# One in-flight run per PR/issue, so a burst of comments can't stack parallel
# API-spending jobs.
#
# `cancel-in-progress` MUST stay false: this workflow triggers on
# `issue_comment`, and the action posts its own "Claude Code is working..."
# tracking comment as claude[bot]. That comment is an `issue_comment: created`
# event on the same PR, so it lands in this same group. With cancelling on, the
# bot's own progress comment killed the run that posted it, ~16s in, every
# time -- observed on #82 (run 29649688617 cancelled by 29649695453).
#
# The `OWNER` gate below already makes those bot-triggered runs skip the job,
# but a run whose jobs all skip STILL cancels the in-flight run in its group.
# Queueing instead of cancelling costs a few seconds of runner time for the
# no-op run and nothing in API spend.
#
# This got MORE load-bearing on 2026-07-26, not less: `issue_comment` used to be
# one trigger of three and is now one of two, both comment events. Every run this
# workflow does is one whose own progress comment re-enters this group.
#
# Tradeoff: a genuine burst of `@claude` comments now serializes rather than
# the newest superseding the older ones. Bounded by the OWNER gate.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # --- On-demand review, triggered by an owner `@claude` comment -----------
  #
  # ONE job as of 2026-07-26, down from two. This was the `review` job (agent
  # mode: an explicit review `prompt`, the tuned tool grant, and the classify
  # step that owns the exit code). The separate tag-mode `mention` job it used to
  # sit beside is GONE, folded into this one — see ADR-005 Amendment 7.
  #
  # Why fold rather than delete: dropping the `pull_request` trigger made this
  # job unreachable, and deleting it would have taken the review prompt and six
  # amendments of classify-step machinery with it, leaving `@claude` answering
  # from the conversational tag-mode path. That would have quietly downgraded
  # the on-demand review at the exact moment it became the ONLY review. This
  # shape also matches defense-news-classifier and kb-agent, which have always
  # run one agent-mode job across both event types.
  #
  # PUBLIC-REPO SECURITY: comment events FAIL OPEN — they run in the base repo's
  # context WITH secrets no matter who commented, unlike fork `pull_request`
  # runs where GitHub withholds them. `author_association == 'OWNER'` is
  # therefore the ONLY thing between a stranger's `@claude` and this repo's API
  # key. It is load-bearing, not defence in depth, and it is evaluated before a
  # runner is allocated.
  #
  # The same-repo fork gate that used to be here went with the `pull_request`
  # trigger. It is unreachable now rather than unnecessary — recorded so it is
  # not dropped by reflex if an automatic pass ever returns.
  review:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@claude') &&
       github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude') &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    steps:
      # No `ref:` — the security-doc "preferred" pattern: never check out the
      # PR's head branch by name.
      #
      # WHAT THIS TREE IS CHANGED on 2026-07-26 and the prompt below was
      # corrected to match. On a `pull_request` event the default was the MERGE
      # ref, so the tree was the PR merged into base. On a comment event
      # `github.ref` is the DEFAULT BRANCH, so the tree is plain `main` — it does
      # not contain the PR's changes at all.
      #
      # This does not break the review, because `gh pr diff` was always the
      # authoritative source for what changed (Amendment 5 made the prompt lead
      # with it). It does narrow what `Read`/`Grep`/`Glob` are good for: repo
      # conventions, CLAUDE.md, neighbouring unchanged code — context, not the
      # change itself. Reading a CHANGED file here shows its pre-PR content.
      #
      # Checking out `refs/pull/N/merge` explicitly would restore the old tree
      # and is the documented follow-up if review depth visibly suffers. Not done
      # here: that ref can be absent on closed or long-merged PRs, and trading a
      # silent narrowing for a loud checkout failure is a bad deal on a change
      # whose entire purpose is to stop this lane costing money unattended.
      - uses: actions/checkout@v7

      # Timestamp taken BEFORE the review runs, so the classify step can tell
      # THIS run's verdict comment from one left by an earlier run.
      #
      # Amendment 3's verdict probe rested on "the review runs once, on open, so
      # at classify time the only claude comment is this review's summary." This
      # workflow is now re-runnable by comment, which makes that false: a second
      # `@claude` on a PR that was already reviewed would find the FIRST run's
      # comment and read a silenced review as a successful one — turning the
      # redden-on-silence calibration off exactly when it is needed. Filtering on
      # `createdAt > SINCE` restores the premise instead of assuming it.
      - name: Record the pre-review timestamp
        id: since
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # `continue-on-error` so the NEXT step decides this job's colour. The
      # action exits 1 for every non-success subtype, which collapses two very
      # different signals — "the review found problems" and "the review ran out
      # of road" — into the same red X. See ADR-005 and the classify step below.
      # Genuine failures still go red there; nothing is being swallowed.
      - uses: anthropics/claude-code-action@v1
        id: claude
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for a public front-end learning repo
            (static HTML/CSS/JS, no build step, served on GitHub Pages).

            You are reviewing PR #${{ github.event.pull_request.number || github.event.issue.number }} of
            ${{ github.repository }}. Pass that number explicitly to every `gh`
            call. This run was triggered by a COMMENT, not by the PR, so `gh`
            cannot infer the PR from the checkout — a bare `gh pr diff` fails
            with "could not determine current branch", and every way of looking
            the number up for yourself is outside your tool grant.

            Start with
            `gh pr diff ${{ github.event.pull_request.number || github.event.issue.number }} --name-only`,
            then
            `gh pr diff ${{ github.event.pull_request.number || github.event.issue.number }}`
            for the content.

            THE CHECKED-OUT TREE IS `main`, NOT THIS PR. A comment-triggered run
            checks out the default branch, so the working tree does not contain
            this PR's changes. `gh pr diff` is the ONLY thing that tells you what
            changed — do not infer it from a file. Use `Read`/`Grep`/`Glob` for
            surrounding context (conventions, CLAUDE.md, unchanged neighbouring
            code); if you open a file this PR modified, you are looking at its
            PRE-PR content, so do not report on it as though it were the change.

            Scope, in priority order:
            - Skip pure moves. A file whose diff is a rename with no content
              change needs no read. Internal-link integrity across a move is
              already enforced by `scripts/link-check.cjs` in the QA job; do
              not re-derive it by hand. Spend the budget on content diffs.
            - Correctness: broken internal links, invalid HTML/CSS/JS, logic
              bugs, accessibility regressions, and the mobile no-horizontal-
              overflow contract described in CLAUDE.md.
            - Security: unsafe innerHTML / injected inline script, mixed
              content, risky external resources, and any leaked secret or
              private-repo name (this repo must never name a private repo).

            Your tools are exactly the following. There is no general shell:
            every command outside these prefixes is denied before it runs, and
            the denial returns nothing but costs you the turn.
            - `Read`, `Grep`, `Glob` for anything in the working tree. Use
              these — not `cat`, `ls`, `head`, `find`, or `grep`.
            - `gh pr diff` and `gh pr view` to see the change. There is no
              `git`, so the diff is the only history you get.
            - `gh pr comment` and
              `mcp__github_inline_comment__create_inline_comment` to publish.
              These two are your only way to say anything to anyone.
            - `Write`, for exactly one path: `review-summary.md` at the root
              of the working tree. Use it to compose your summary body, then
              post with `gh pr comment <N> --body-file review-summary.md`.
              Do not write to `/tmp` — it is outside the working tree, and
              every write there is denied.

            Keep every command free of `$(...)` and backticks. Command
            substitution makes a command unanalyzable, so it is denied even
            when it starts with a granted prefix — `gh pr comment N --body
            "$(cat <<'EOF' ...)"` is a denied call, not a granted one. A
            backtick inside a double-quoted `--body` string is command
            substitution too. So prefer the body file: `Write` your summary
            to `review-summary.md` and pass `--body-file`. If that one Write
            is denied, do not retry it — fall back to a single
            `gh pr comment <N> --body "..."` whose body carries no backtick,
            no `$`, and no double quote.

            Do not run this repo's QA gates (`scripts/*.cjs`, `scripts/*.py`)
            or any other program. The `qa` workflow already ran all of them
            against this PR; their result is not yours to reproduce. Reaching
            for shell you do not have is the single most common way this
            review fails — on three PRs it spent most of its turns on denied
            commands and then stopped without saying anything at all.

            If a call is denied, NOTHING CAN APPROVE IT. This is an unattended
            run: there is no human on the other end, and asking for permission
            ends the review in silence rather than pausing it. Never ask for
            approval and never wait for one — reach for a granted tool instead,
            and post your summary with what you already have.

            Post as you go rather than saving it all for the end: use
            `mcp__github_inline_comment__create_inline_comment` for anything
            you can pin to a file and line, and close with ONE summary comment
            via `gh pr comment`. Never end your run without that summary — a
            review that reached a conclusion and did not post it is
            indistinguishable from no review at all. If you are running short
            on turns, post the summary immediately — a partial review that is
            posted beats a thorough one that never lands.

            Be honest and specific: skip nitpicks that don't affect
            correctness, security, or the mobile contract, and if the PR looks
            clean say so plainly.
          # --model      the docs' own examples use `claude-sonnet-5` (a cheap
          #              tier) for review workflows.
          # --max-turns  caps iterations (docs: "Configure appropriate
          #              --max-turns ... to prevent excessive iterations").
          # --allowedTools  THE FIX. Agent mode grants no Bash and installs no
          #              GitHub comment MCP server unless the tools are named
          #              here (see src/modes/agent/index.ts + src/mcp/
          #              install-mcp-server.ts: `shouldIncludeCommentServer =
          #              !isAgentMode || hasGitHubCommentTools`). Without this
          #              line the review agent could not read the diff and had
          #              no channel to publish a finding on. From #81 (the
          #              2026-07-13 pilot) to #101 it never posted one comment
          #              on one PR: every green check was a silent no-op, and
          #              every red one was the same no-op that took more turns
          #              to give up.
          #
          #              Read/Grep/Glob added 2026-07-24 (Amendment 2). Agent
          #              mode grants ONLY what is listed here, so before them the
          #              review could fetch the DIFF (`gh pr diff`) but could not
          #              open a changed file for full context, grep for a leaked
          #              private-repo name, or glob to find one. On #108 (an
          #              inline-SVG + CSS diff, unreviewable without reading the
          #              file) it tried 5 file reads, all denied, and posted
          #              nothing -- GREEN. The `@claude` job never hit this: tag
          #              mode installs the default toolset (incl. Read), the
          #              asymmetry #108 exposed. NOT copied from the action's
          #              examples/pr-review-comprehensive.yml -- that grants no
          #              Read either, but it runs `track_progress` mode; this is
          #              plain agent mode, and #108's denials are the measurement.
          #
          #              DELIBERATELY NOT WIDENED on 2026-07-25 (Amendment 4),
          #              though every review since Amendment 3's naming landed has
          #              hit Bash denials -- 4, 10, 2, 8, 11, 4 across six runs
          #              (#113-#118), three of which died silent. Widening was the
          #              obvious move and it
          #              would have been the fourth guess in this record: the
          #              classify step names the denied TOOL, and for every shell
          #              command that name is the string "Bash", so nobody has ever
          #              seen which command was denied. The fix is upstream of the
          #              grant -- log the denied command (below) and tell the agent
          #              what it actually has (the prompt's tool paragraph) -- and
          #              the grant gets tuned on the next run's real data.
          #
          #              KNOWN GAP, left open on purpose: `actions: read` is
          #              granted above so the review can see whether `qa` passed,
          #              but no `Bash(gh pr checks:*)` makes it reachable. Folded
          #              into the same data-driven widening rather than guessed at
          #              alongside everything else.
          #
          #              CAUSE FOUND 2026-07-25 (Amendment 5), and it was never a
          #              missing grant. This job checks out the MERGE REF, which is
          #              DETACHED, so `gh` cannot infer a PR from a branch and the
          #              `gh pr diff` this prompt opened with failed outright with
          #              "could not determine current branch". The agent then went
          #              looking for the number (`gh pr list`), was denied, and
          #              ASKED FOR APPROVAL AND WAITED -- which in an unattended run
          #              is silence. Reproduced against #118 with this exact grant:
          #              on a checked-out branch, 0 denials and a clean review;
          #              detached, the failure. The prompt now passes the number
          #              this workflow has known all along, so the discovery call is
          #              never made. Still not widened -- granting it would buy the
          #              agent a workaround for a prompt defect on a job holding
          #              `pull-requests: write`.
          #
          #              WIDENED 2026-08-30, on run 33318744438 (PR #245). The
          #              review reached a verdict and could not post it. It
          #              composed
          #              `gh pr comment 245 --body "$(cat <<'EOF' ...)"`. The
          #              `$(...)` substitution makes a command unanalyzable, so
          #              the granted `Bash(gh pr comment:*)` prefix never
          #              matched and the call was denied. The agent's fallback
          #              -- `Write` the body to /tmp/pr245_comment.md, then
          #              `--body-file` -- was denied too, because no Write rule
          #              existed. So every verdict on the redesign-lane PRs
          #              landed only as a truncated denial annotation. The
          #              grant now adds `Write(//tmp/**)` (`//` is the
          #              documented absolute-path anchor), and the prompt names
          #              the body-file shape and bans `$(...)`. NOT granted:
          #              unscoped Write, and nothing that merges or pushes --
          #              this widening covers posting only.
          #
          #              MEASURED 2026-08-30, same day, on run 33327226664
          #              (PR #240): `Write(//tmp/**)` does not work here. The
          #              action delivered the rule intact in its resolved
          #              config (CLI 2.1.251), and all three Write calls to
          #              /tmp/pr240-summary.md were denied anyway. The likely
          #              boundary is the working tree; this file records only
          #              the measurement. The verdict still posted, through a
          #              plain `--body` string, because the `$(...)` ban held
          #              -- and it held only because that body carried no
          #              backticks: inside a double-quoted `--body`, a
          #              backtick is command substitution and the same denial.
          #              So the grant is now `Write(review-summary.md)` -- one
          #              relative path inside the checkout, the documented
          #              rule shape -- and the prompt names that exact file
          #              and bans `--body` for the summary.
          #
          #              CAUSE FOUND 2026-08-30, third measurement. Run
          #              33327716725 (PR #240 again) denied
          #              `Write(review-summary.md)` too -- four calls to the
          #              exact granted path, at the workspace root, and the
          #              verdict again went out over a bare `--body`. The rule
          #              was never consulted: a local repro on the same CLI
          #              version (2.1.251) returned the engine's own warning,
          #              "Write(foo-test.md) is not matched by file permission
          #              checks -- only Edit(path) rules are. Use
          #              Edit(foo-test.md) instead (Edit rules cover all
          #              file-editing tools)." There is no Write(path) rule
          #              namespace at all, on any path shape -- which also
          #              explains the //tmp/** attempt. The grant is now
          #              `Edit(review-summary.md)`: the Edit rule namespace,
          #              covering the Write tool, anchored at the SDK cwd
          #              (GITHUB_WORKSPACE -- the action passes no cwd option,
          #              per base-action/src/run-claude-sdk.ts). The prompt
          #              keeps a legal fallback (one plain `--body` with no
          #              backticks) so a mismatch degrades to a warning, not
          #              to silence.
          #
          # max-turns was 25, on the theory that denied tool calls -- not the
          # ceiling -- were the binding constraint: of the 26 turns PR #101
          # spent, 11 were denials returning nothing. That line invited its own
          # test ("if 25 still exhausts, the classify step says so honestly and
          # we tune against real numbers instead of guessing again").
          #
          # It exhausted. PR #105 was a 2-file, 123-line diff -- far smaller
          # than #101 -- and hit the ceiling at 26 turns with **0 denials**.
          # That is the real number the old comment asked for, and it falsifies
          # the denials-only hypothesis: with the tool grant fixed, a small diff
          # still needs more than 25 turns to read, judge, and publish.
          #
          # 40 is sized from that measurement, not guessed: ~26 turns bought
          # context-gathering on a small diff, so a large one plus the
          # comment-posting turns needs roughly half again. The classify step
          # still reports honestly if 40 exhausts, so this stays tunable
          # against evidence rather than becoming a number nobody may touch.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Edit(review-summary.md),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

      # Turn "the action exited non-zero" into a signal that distinguishes
      # I-found-problems from I-ran-out-of-road. See ADR-005 for the reasoning.
      #
      # Inline rather than a `.github/scripts/` file on purpose: the Claude App
      # refuses to run when the workflow file differs from the copy on the
      # default branch, and that validation covers THIS file only. A separate
      # script would be an unvalidated input to a job holding a
      # `pull-requests: write` token.
      - name: Classify the review outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          STEP_OUTCOME: ${{ steps.claude.outcome }}
          SINCE: ${{ steps.since.outputs.ts }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # No execution file means Claude never ran. The common cause is the
          # workflow-validation skip that fires on any PR editing this file —
          # that is a legitimate skip, not a failure.
          if [ -z "${EXEC_FILE:-}" ] || [ ! -f "$EXEC_FILE" ]; then
            if [ "$STEP_OUTCOME" = "success" ]; then
              echo "No execution file; the action skipped itself (workflow validation). Nothing to classify."
              exit 0
            fi
            echo "::error::Claude review failed before it produced an execution file."
            exit 1
          fi

          # The file is the SDK message log; the terminal `result` message
          # carries the verdict. Tolerate a bare object in case that changes.
          RESULT=$(jq -c 'if type == "array" then (map(select(.type == "result")) | last) else . end' "$EXEC_FILE")
          SUBTYPE=$(jq -r '.subtype // "unknown"' <<<"$RESULT")
          TURNS=$(jq -r '.num_turns // 0' <<<"$RESULT")
          # The raw SDK result carries the ARRAY `permission_denials`;
          # `permission_denials_count` (which this line read until 2026-07-24) is
          # a synthetic field the action prints only in its stdout summary
          # (base-action/src/run-claude-sdk.ts: `permission_denials_count:
          # resultMsg.permission_denials?.length ?? 0`) and is ABSENT from the
          # saved execution log. Reading the missing key returned 0 on every run
          # -- which is why Decision 5's warning never once fired and why #108's
          # 5 denials read as 0 here while turns and cost matched to the digit.
          # Count the array. `// 0` covers a result with no denials at all.
          DENIALS=$(jq -r '(.permission_denials | length) // 0' <<<"$RESULT")
          COST=$(jq -r '(.total_cost_usd // 0) * 10000 | round / 10000' <<<"$RESULT")
          # Name the denied tools so "widen --allowedTools" is actionable. Tool
          # NAMES are safe to log; only tool OUTPUTS carry secrets, which is why
          # show_full_output stays off. Defensive field chain -- the SDK denial
          # element is `tool_name`, but fall back rather than print nothing if the
          # shape shifts. `[]?` tolerates a result with no denials.
          DENIED_TOOLS=$(jq -r '[.permission_denials[]? | (.tool_name // .name // .tool // "unknown")] | unique | join(", ")' <<<"$RESULT" 2>/dev/null)

          # Name the denied CALL, not just the tool (ADR-005 Amendment 4). The
          # tool name alone is useless for the case that actually matters: every
          # shell command denies as "Bash", so six runs of denial data named the
          # same four letters and told nobody which command to grant. The
          # SDK denial element carries `tool_input`; for Bash that is `.command`.
          #
          # Why this does not reopen the show_full_output question the
          # Alternatives table settled: that input dumps tool RESULTS -- repo
          # content, API responses, anything a command read -- and the action's
          # own docs warn it "may contain secrets." This prints a tool INPUT for
          # a call that was DENIED, so it never executed and read nothing. It is
          # a string the agent composed from a public diff.
          #
          # Rendered into the PR comment as an INDENTED code block (four spaces),
          # not an inline code span. A span would have to be delimited by
          # backticks, and an agent-composed command containing one would break
          # out of it -- so the span would need the command sanitised, and the
          # sanitiser would need a literal apostrophe inside the shell
          # single-quotes around the jq program, which closes them. The indented
          # block needs no delimiter, so none of that exists. Newlines and tabs
          # still collapse to spaces (one denial, one line) and 160 chars is the
          # cap.
          #
          # Extracted once as JSON and rendered twice, rather than sharing one
          # program string across two jq calls -- sharing means double-quoting it
          # in the shell, and that eats jq variables (`$n`) before jq sees them.
          #
          # Guarded at TWO levels, and the inner one is the load-bearing half.
          # `|| echo []` alone (all this had until 2026-07-25) is whole-program:
          # `.tool_input.command` raises "Cannot index string with string" if any
          # ONE element's `tool_input` is not an object, jq exits non-zero, and
          # the fallback discards the commands for every OTHER denial too. The
          # comment then renders "(could not be extracted)" and points the reader
          # at the job log, where `show_full_output: false` means they are not
          # either -- a dead end on the red path, which is the one path where the
          # commands are the only thing there is to act on. `try ... catch null`
          # per field costs one line its detail instead of costing all of them:
          # a bad `tool_input` still yields `Bash`, a bad element still yields
          # `unknown`. `|| echo []` stays as the outer net for a shape change
          # that breaks the program itself. Same defensiveness as the
          # `.tool_name // .name // .tool` chain above, for the same reason
          # Amendment 2 exists -- the SDK moved a field once already.
          DENIED_LIST=$(jq -c '[.permission_denials[]?
            | {n: ((try (.tool_name // .name // .tool) catch null)
                   // "unknown" | tostring),
               i: ((try (.tool_input.command // .tool_input.file_path
                         // .tool_input.pattern // .tool_input.url) catch null)
                   // "" | tostring
                   | gsub("[\n\r\t]"; " "))}
            | if .i == "" then .n
              elif (.i | length) > 160 then .n + ": " + .i[0:160] + "..."
              else .n + ": " + .i end]
            | unique' <<<"$RESULT" 2>/dev/null || echo '[]')
          DENIED_CALLS=$(jq -r 'join(" | ")' <<<"$DENIED_LIST" 2>/dev/null || true)
          DENIED_CALLS_MD=$(jq -r 'map("    " + .) | join("\n")' <<<"$DENIED_LIST" 2>/dev/null || true)
          # Only reachable if the extraction above degraded; without it the
          # comment would show an empty code block and read as "denied nothing."
          DENIED_CALLS_MD="${DENIED_CALLS_MD:-    (could not be extracted -- see the job log)}"

          echo "subtype=$SUBTYPE turns=$TURNS denials=$DENIALS cost_usd=$COST denied_tools=[$DENIED_TOOLS]"
          if [ -n "${DENIED_CALLS:-}" ]; then
            echo "denied_calls: $DENIED_CALLS"
          fi

          # Denials, calibrated by whether the review actually produced a verdict
          # (ADR-005 Amendment 3). Amendment 2 reddened on ANY denial; #111 proved
          # that fires on a GOOD review -- the agent speculatively reaches for
          # ungranted-but-harmless tools it does not need (cat/ls/git/etc.), posts
          # a real verdict anyway, and those stray denials would redden a clean
          # review, which is the meaningless-red disease this whole record treats.
          # So a denial is RED only when it actually SILENCED the review; when a
          # verdict was posted it is an FYI to tune the grant, and the check stays
          # green. #108 (denied into silence) still reddens; #111 (verdict despite
          # denials) does not.
          #
          # "Did it post a verdict?" = did `claude` author an issue comment on this
          # PR **during this run**. Its prompt mandates one via `gh pr comment`;
          # the classify step's own comment is authored by github-actions, not
          # claude, so it is never self-counted. An inline-only review with no
          # summary counts as no-verdict -- it violates the prompt, and reddening
          # it is acceptable.
          #
          # The `createdAt > env.SINCE` filter is what makes "during this run"
          # true. Amendment 3 could assume it: the review fired once, on open, so
          # any claude comment had to be its own. Amendment 7 made the lane
          # re-runnable by comment, so an earlier run's verdict would otherwise
          # count as this one's and a silenced re-review would go green. `SINCE`
          # is stamped by a step before the review; both timestamps are UTC
          # ISO-8601, which compares correctly as a string.
          #
          # Still ONE `gh ... --jq` call, deliberately: jq reads `env.SINCE`
          # directly, so this needs no `--arg` and no second process. The shape
          # is what scripts/classify-review-outcome.test.cjs stubs.
          if [ "$DENIALS" -gt 0 ]; then
            POSTED=$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.author.login | ascii_downcase | contains("claude")) | select(.createdAt > env.SINCE)] | length' 2>/dev/null || echo 0)
            if [ "${POSTED:-0}" -gt 0 ]; then
              echo "::warning::Review posted a verdict but was denied $DENIALS tool call(s): ${DENIED_CALLS:-${DENIED_TOOLS:-unknown}}. Not failing -- the review completed. Grant these in --allowedTools to silence the noise."
            else
              gh pr comment "$PR" --body "$(cat <<EOF
          ### Automated review blocked by a tooling gap — not a verdict on the PR

          The review agent was denied **$DENIALS tool call(s)** and posted **no
          verdict**, so nothing here was reviewed. This is a \`--allowedTools\`
          gap in \`.github/workflows/claude-review.yml\`, not a finding about your
          change — treat this check as *absent*, not passed and not failed.

          | | |
          |---|---|
          | tool calls denied | $DENIALS |
          | denied tools | ${DENIED_TOOLS:-unknown} |
          | turns used | $TURNS |
          | cost | \$$COST |
          | run | [$GITHUB_RUN_ID]($RUN_URL) |

          The calls it was denied — composed by the agent, none of them executed:

          $DENIED_CALLS_MD

          Grant what the review genuinely needs in \`--allowedTools\`, then
          re-run with \`@claude\`. Not everything listed deserves a grant: the
          agent reaches speculatively, and a call it did not need is a prompt
          problem, not a permissions one.
          EOF
          )"
              echo "::error::Review blocked into silence: $DENIALS tool call(s) denied (${DENIED_CALLS:-${DENIED_TOOLS:-unknown}}), no verdict posted — a --allowedTools defect, not a PR verdict. Failing so the check reads as 'fix CI'."
              exit 1
            fi
          fi

          case "$SUBTYPE" in
            success)
              echo "Review completed in $TURNS turns."
              ;;
            error_max_turns)
              gh pr comment "$PR" --body "$(cat <<EOF
          ### Automated review inconclusive — this is not a verdict on the PR

          The review agent hit its turn ceiling after **$TURNS turns** and stopped
          before finishing. **Nothing in this PR has been reviewed.** Treat this
          check as *absent* — not as passed, and not as failed.

          | | |
          |---|---|
          | turns used | $TURNS |
          | tool calls denied | $DENIALS |
          | cost | \$$COST |
          | run | [$GITHUB_RUN_ID]($RUN_URL) |

          Re-run it by commenting \`@claude\` on this PR. If \`tool calls denied\`
          above is non-zero, fix \`--allowedTools\` in
          \`.github/workflows/claude-review.yml\` first — that is where the budget
          went, and re-running without fixing it will exhaust the same way.
          EOF
          )"
              echo "::warning::Review inconclusive: hit the turn ceiling at $TURNS turns. Posted an inconclusive comment on the PR; not failing the job — an unreviewed PR is not a rejected PR."
              ;;
            *)
              echo "::error::Claude review failed with subtype '$SUBTYPE' after $TURNS turns. This is an execution failure, not a review verdict."
              exit 1
              ;;
          esac

